name: Windows CI and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  queue: max

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test Go packages
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
      - name: Select release version
        id: version
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw internal/buildinfo/version.txt).Trim()
          $tags = @(git tag --list --sort=-version:refname | Where-Object { $_ -cmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' })
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tags.Count -gt 0) {
            git merge-base --is-ancestor HEAD $tags[0]
            if ($LASTEXITCODE -eq 0) {
              Write-Host "This commit is already covered by $($tags[0])."
              exit 0
            }
            if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
            $previous = [version]($tags[0].Substring(1))
            $version = "$($previous.Major).$($previous.Minor).$($previous.Build + 1)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: steps.version.outputs.version != ''
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build Windows installers
        if: steps.version.outputs.version != ''
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $goBin = Join-Path (go env GOPATH) 'bin'
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $env:PATH = "$(Join-Path $env:MSYS2_ROOT 'ucrt64\bin');$env:PATH"
          $env:CC = Join-Path $env:MSYS2_ROOT 'ucrt64\bin\gcc.exe'
          $options = @{
            Version = $env:RELEASE_VERSION
            UpdateRepository = $env:GITHUB_REPOSITORY
            Wails = Join-Path $goBin 'wails3.exe'
            Makensis = $nsis
          }
          .\packaging\build.ps1 @options -Installer -Architecture amd64
          .\packaging\build.ps1 @options -Installer -Offline -Architecture amd64
          .\packaging\build.ps1 @options -Installer -Architecture arm64
      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.version != ''
        with:
          name: windows-installers
          path: bin/Shengji-*-installer.exe
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-installers
          path: installers
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            installers/Shengji-amd64-installer.exe \
            installers/Shengji-amd64-offline-installer.exe \
            installers/Shengji-arm64-installer.exe \
            --target "$GITHUB_SHA" --title "声记 v$RELEASE_VERSION" --generate-notes --latest
